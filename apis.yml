apis:
- aid: ciloo:ciloo-cart-api
  name: Ciloo Cart API
  description: >-
    OAuth 1.0a (HMAC-SHA1) REST API on the ciloo/v1 namespace of a Ciloo brand store. Read, add, update
    and remove cart items; mint per-customer OAuth credentials from admin credentials; and issue one-hour
    auto-login tokens that drop a customer straight into the store's cart or order history. Customer records
    are created and updated through the WooCommerce wc/v3 namespace on the same host. Requests are form-encoded
    — the provider documents that a JSON content type breaks the signature.
  humanURL: https://api.cilooprint.com/ciloo-cart-api-documentation/
  baseURL: https://{store_domain}/wp-json/ciloo/v1
  tags:
  - Cart
  - Customers
  - Authentication
  - Print on Demand
  tags_raw:
  - Cart
  - Customers
  - Authentication
  - Print On Demand
