aid: ciloo
name: Ciloo
description: >-
  Ciloo is a Rotterdam-headquartered global platform for branded products and promotional merchandise.
  Enterprises run a branded Ciloo store — business cards, apparel, stationery, signage, corporate gifts
  and sales collateral — and every order placed in it is produced on demand by a vetted production
  partner near the recipient, which Ciloo positions as cutting cost, waste and shipping distance while
  keeping brand control central. The platform is used by manufacturing, medical-device, professional-
  services and franchise organisations, and integrates with digital asset management (Frontify, Bynder,
  Canto, Aprimo, Papirfly, Brandfolder, Marvia), procurement and ERP (SAP Ariba, S/4HANA, Proactis,
  Proqura, Exact), SSO, and WooCommerce. Ciloo documents two APIs on its own knowledge centre at
  api.cilooprint.com: a per-brand-store Cart API secured with OAuth 1.0a, and a bidirectional Printer
  API integration that pushes orders to production partners and receives production and shipping status
  callbacks in return.
