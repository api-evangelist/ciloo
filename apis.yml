- aid: ciloo:ciloo-printer-api
  name: Ciloo Printer API Integration
  description: >-
    Bidirectional order integration between Ciloo and its production partners. Ciloo POSTs a print order
    — items, print components with artwork paths and substrate attributes, and shipments with carrier
    and destination — to the partner's own order endpoint; the partner POSTs production-status and shipping
    callbacks, with tracking, back to a Ciloo-owned inbound callback URL. Authentication is agreed per
    partner rather than published.
  humanURL: https://api.cilooprint.com/printer-api-integration/
  baseURL: https://dashboard.cilooprint.com/ciloo-order-callback/printer-inbound
  tags:
